---
# =============================================================
# .github/workflows/ci.yml — CloudPilot CI/CD Pipeline
# 10-stage pipeline: lint → test → security → build → scan →
#                    push → deploy-staging → smoke-test →
#                    rollback (conditional) → notify
# =============================================================

name: CloudPilot CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

# ─────────────────────────────────────────────────────────────
# Job 1 — Lint
# ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: 🔍 Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install black==24.8.0 isort==5.13.2 flake8==7.1.1 mypy==1.11.2
          pip install -r requirements.txt

      - name: Run Black (format check)
        run: black --check --diff app/ tests/

      - name: Run isort (import order check)
        run: isort --check-only --diff app/ tests/

      - name: Run Flake8 (style check)
        run: flake8 app/ tests/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run mypy (type check)
        run: mypy app/ --ignore-missing-imports --python-version=3.12

# ─────────────────────────────────────────────────────────────
# Job 2 — Test
# ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Publish coverage to job summary
        if: always()
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          pip install coverage
          coverage report --format=markdown --omit="tests/*" >> $GITHUB_STEP_SUMMARY || true

# ─────────────────────────────────────────────────────────────
# Job 3 — Security Code Scan
# ─────────────────────────────────────────────────────────────
  security-code-scan:
    name: 🔒 Security Code Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          pip install --upgrade pip
          pip install bandit==1.7.10 pip-audit==2.7.3
          pip install -r requirements.txt

      - name: Run Bandit (SAST)
        run: |
          bandit -r app/ -ll -f json -o bandit-report.json || true
          bandit -r app/ -ll -f txt
        continue-on-error: false

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip-audit -r requirements.txt --format=json --output=pip-audit-report.json || true
          pip-audit -r requirements.txt

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-code-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

# ─────────────────────────────────────────────────────────────
# Job 4 — Docker Build
# ─────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test, security-code-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image (without push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cloudpilot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/cloudpilot-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/cloudpilot-image.tar
          retention-days: 1

# ─────────────────────────────────────────────────────────────
# Job 5 — Trivy Container Scan
# ─────────────────────────────────────────────────────────────
  trivy-scan:
    name: 🛡️ Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/cloudpilot-image.tar

      - name: Run Trivy vulnerability scan (CRITICAL/HIGH — fail build)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudpilot:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Run Trivy full scan (SARIF for GitHub Security tab)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cloudpilot:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          retention-days: 30

# ─────────────────────────────────────────────────────────────
# Job 6 — Push to GHCR
# ─────────────────────────────────────────────────────────────
  push:
    name: 📦 Push to GHCR
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

# ─────────────────────────────────────────────────────────────
# Job 7 — Deploy to Staging
# ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [push]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Configure kubectl from secret
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set image tag in manifests
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Deploying image: $IMAGE_TAG"
          sed -i "s|image: cloudpilot:latest|image: $IMAGE_TAG|g" k8s/deployment.yaml

      - name: Create namespace if not exists
        run: |
          kubectl create namespace cloudpilot --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ --namespace=cloudpilot
          echo "✅ Kubernetes manifests applied"

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/cloudpilot \
            --namespace=cloudpilot \
            --timeout=300s
          echo "✅ Deployment rollout complete"

# ─────────────────────────────────────────────────────────────
# Job 8 — Smoke Test
# ─────────────────────────────────────────────────────────────
  smoke-test:
    name: 💨 Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    outputs:
      smoke-passed: ${{ steps.smoke.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Configure kubectl from secret
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Port-forward application
        run: |
          kubectl port-forward svc/cloudpilot-service 8000:8000 \
            --namespace=cloudpilot &
          sleep 5
          echo "PORT_FORWARD_PID=$!" >> $GITHUB_ENV

      - name: Run smoke tests
        id: smoke
        run: |
          echo "passed=false" >> $GITHUB_OUTPUT

          MAX_RETRIES=10
          RETRY_DELAY=5

          wait_for_endpoint() {
            local url=$1
            local name=$2
            for i in $(seq 1 $MAX_RETRIES); do
              echo "[$i/$MAX_RETRIES] Checking $name at $url..."
              if curl -sf --max-time 10 "$url" > /dev/null; then
                echo "✅ $name is healthy"
                return 0
              fi
              sleep $RETRY_DELAY
            done
            echo "❌ $name failed after $MAX_RETRIES retries"
            return 1
          }

          # Test /health endpoint
          wait_for_endpoint "http://localhost:8000/health" "Health endpoint" || exit 1

          # Test /api/v1/slo endpoint
          wait_for_endpoint "http://localhost:8000/api/v1/slo" "SLO endpoint" || exit 1

          # Test /metrics endpoint (Prometheus)
          wait_for_endpoint "http://localhost:8000/metrics" "Metrics endpoint" || exit 1

          # Verify response body of health check
          HEALTH_RESPONSE=$(curl -sf http://localhost:8000/health)
          echo "Health response: $HEALTH_RESPONSE"

          echo "passed=true" >> $GITHUB_OUTPUT
          echo "✅ All smoke tests passed!"

      - name: Cleanup port-forward
        if: always()
        run: |
          kill $PORT_FORWARD_PID 2>/dev/null || true

# ─────────────────────────────────────────────────────────────
# Job 9 — Rollback (if smoke-test fails)
# ─────────────────────────────────────────────────────────────
  rollback:
    name: ⏪ Rollback Deployment
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always() && needs.smoke-test.outputs.smoke-passed == 'false' && github.ref == 'refs/heads/main'
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Configure kubectl from secret
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback deployment
        run: |
          echo "⚠️  Smoke test failed — initiating rollback..."
          kubectl rollout undo deployment/cloudpilot \
            --namespace=cloudpilot
          echo "Waiting for rollback to complete..."
          kubectl rollout status deployment/cloudpilot \
            --namespace=cloudpilot \
            --timeout=300s
          echo "✅ Rollback complete"

      - name: Verify rollback health
        run: |
          kubectl port-forward svc/cloudpilot-service 8000:8000 \
            --namespace=cloudpilot &
          sleep 5
          curl -sf http://localhost:8000/health && echo "✅ Rollback is healthy" || echo "⚠️  Rollback health check failed"

# ─────────────────────────────────────────────────────────────
# Job 10 — Notify / Summary
# ─────────────────────────────────────────────────────────────
  notify:
    name: 📢 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security-code-scan, docker-build, trivy-scan, push, deploy-staging, smoke-test]
    if: always()
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: artifacts/tests
        continue-on-error: true

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage
        continue-on-error: true

      - name: Build job summary
        run: |
          echo "# 🚀 CloudPilot CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | ${{ needs.security-code-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Trivy Scan | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Push | ${{ needs.push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Deploy Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 💨 Smoke Test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Evaluate overall pipeline result
        run: |
          if [[ "${{ needs.smoke-test.result }}" == "success" ]]; then
            echo "✅ Pipeline PASSED — CloudPilot deployed successfully to staging"
          elif [[ "${{ needs.smoke-test.result }}" == "skipped" ]]; then
            echo "⚠️  Pipeline completed (deploy skipped — not on main branch)"
          else
            echo "❌ Pipeline FAILED — check individual job logs"
            exit 1
          fi
