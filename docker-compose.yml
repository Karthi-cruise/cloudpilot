---
# =============================================================
# docker-compose.yml — CloudPilot Local Development Stack
# Includes: app, prometheus, grafana, alertmanager
# =============================================================

version: '3.9'

services:
  # -----------------------------------------------------------
  # CloudPilot Application
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cloudpilot-app
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - VERSION=dev
      - POD_NAME=docker-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - cloudpilot
    volumes:
      # Hot-reload: mount app directory over the image copy
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # -----------------------------------------------------------
  # Prometheus — Metrics Collection
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: cloudpilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    networks:
      - cloudpilot
    restart: unless-stopped

  # -----------------------------------------------------------
  # Grafana — Dashboards & Visualisation
  # -----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: cloudpilot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=cloudpilot
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./k8s/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on:
      - prometheus
    networks:
      - cloudpilot
    restart: unless-stopped

  # -----------------------------------------------------------
  # Alertmanager — Alert Routing & Notifications
  # -----------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cloudpilot-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    networks:
      - cloudpilot
    restart: unless-stopped

# -----------------------------------------------------------
# Volumes
# -----------------------------------------------------------
volumes:
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local

# -----------------------------------------------------------
# Networks
# -----------------------------------------------------------
networks:
  cloudpilot:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
