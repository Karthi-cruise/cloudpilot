apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudpilot.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudpilot.labels" . | nindent 4 }}
    component: config
data:
  VERSION: {{ .Values.configuration.version | quote }}
  LOG_LEVEL: {{ .Values.configuration.logLevel | quote }}
  SLO_AVAILABILITY_TARGET: {{ .Values.slo.availabilityTarget | quote }}
  METRICS_PORT: "8000"
  SLO_LATENCY_P99_MS: {{ .Values.slo.latencyP99TargetMs | quote }}
  SLO_ERROR_RATE: {{ .Values.slo.errorRateTarget | quote }}
