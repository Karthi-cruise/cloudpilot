apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudpilot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudpilot.labels" . | nindent 4 }}
    component: api
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cloudpilot.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
