apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudpilot
  labels:
    app: grafana
    component: monitoring
    team: platform-engineering
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
