apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudpilot
  labels:
    app: prometheus
    component: monitoring
    team: platform-engineering
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
