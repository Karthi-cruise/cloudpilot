apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: '15s'
      exemplarTraceIdDestinations: []
      prometheusType: Prometheus
      prometheusVersion: '2.40.0'
      cacheLevel: 'Low'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: '10m'
    version: 1
