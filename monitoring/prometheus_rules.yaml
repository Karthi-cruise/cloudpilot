groups:
  # ─────────────────────────────────────────────────────────────────────────────
  # SLO Burn Rate Rules (Alerting + Recording)
  # Target SLO: 99.5% availability (error budget = 0.5%)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cloudpilot.slo
    interval: 30s
    rules:
      # --- Recording rules for efficient multi-window SLO calculations ---
      - record: job:cloudpilot_requests:rate1h
        expr: rate(cloudpilot_requests_total[1h])

      - record: job:cloudpilot_errors:rate1h
        expr: rate(cloudpilot_errors_total[1h])

      - record: job:cloudpilot_requests:rate6h
        expr: rate(cloudpilot_requests_total[6h])

      - record: job:cloudpilot_errors:rate6h
        expr: rate(cloudpilot_errors_total[6h])

      - record: job:cloudpilot_requests:rate24h
        expr: rate(cloudpilot_requests_total[24h])

      - record: job:cloudpilot_errors:rate24h
        expr: rate(cloudpilot_errors_total[24h])

      - record: job:cloudpilot_requests:rate5m
        expr: rate(cloudpilot_requests_total[5m])

      - record: job:cloudpilot_errors:rate5m
        expr: rate(cloudpilot_errors_total[5m])

      # Error ratio recording rules
      - record: job:cloudpilot_error_ratio:rate1h
        expr: |
          job:cloudpilot_errors:rate1h
          / job:cloudpilot_requests:rate1h

      - record: job:cloudpilot_error_ratio:rate6h
        expr: |
          job:cloudpilot_errors:rate6h
          / job:cloudpilot_requests:rate6h

      - record: job:cloudpilot_error_ratio:rate5m
        expr: |
          job:cloudpilot_errors:rate5m
          / job:cloudpilot_requests:rate5m

      # --- Alerting rules ---

      # Fast burn: >14.4x budget consumption over 1h window
      # Rationale: At 14.4x the 0.5% budget burn rate, the monthly budget
      # would be exhausted in ~1 hour (30 days / 14.4 ≈ 2 days → 1h window burn).
      - alert: CloudPilotSLOFastBurn
        expr: |
          (
            rate(cloudpilot_errors_total[1h])
            / rate(cloudpilot_requests_total[1h])
          ) > 14.4 * (1 - 0.995)
        for: 2m
        labels:
          severity: critical
          team: platform
          slo: availability
        annotations:
          summary: 'CloudPilot SLO Fast Burn Rate Alert'
          description: >-
            Error budget burning at {{ $value | humanizePercentage }} per second.
            At this rate, the entire monthly error budget will be exhausted in
            under 1 hour. Immediate action required.
          runbook: 'https://github.com/Karthi-cruise/cloudpilot/docs/slo-runbook.md'
          dashboard: 'http://grafana:3000/d/cloudpilot-main'

      # Slow burn: >6x budget consumption sustained over 6h
      # Rationale: At 6x burn rate sustained for 6h, ~5% of monthly budget
      # is consumed per day → full exhaustion in ~20 days.
      - alert: CloudPilotSLOSlowBurn
        expr: |
          (
            rate(cloudpilot_errors_total[6h])
            / rate(cloudpilot_requests_total[6h])
          ) > 6 * (1 - 0.995)
        for: 15m
        labels:
          severity: warning
          team: platform
          slo: availability
        annotations:
          summary: 'CloudPilot SLO Slow Burn Rate Alert'
          description: >-
            Error budget is being consumed steadily at {{ $value | humanizePercentage }}.
            At this rate, the monthly error budget will be exhausted in under 5 days.
          runbook: 'https://github.com/Karthi-cruise/cloudpilot/docs/slo-runbook.md'
          dashboard: 'http://grafana:3000/d/cloudpilot-main'

      # High error rate — immediate operational signal (not SLO-specific)
      - alert: CloudPilotHighErrorRate
        expr: |
          rate(cloudpilot_errors_total[5m])
          / rate(cloudpilot_requests_total[5m]) > 0.05
        for: 1m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High error rate detected'
          description: >-
            Error rate is {{ $value | humanizePercentage }} over the last 5 minutes
            (threshold: 5%). Check application logs for root cause.
          runbook: 'https://github.com/Karthi-cruise/cloudpilot/docs/high-error-rate.md'

      # P99 latency breach
      - alert: CloudPilotHighLatency
        expr: |
          histogram_quantile(0.99,
            rate(cloudpilot_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High P99 latency detected'
          description: >-
            P99 request latency is {{ $value | humanizeDuration }} (threshold: 500ms).
            Users are experiencing slow responses.
          runbook: 'https://github.com/Karthi-cruise/cloudpilot/docs/high-latency.md'

      # Dead service — no traffic for 5 minutes
      - alert: CloudPilotNoRequests
        expr: rate(cloudpilot_requests_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'CloudPilot receiving no requests'
          description: >-
            No requests have been received in the last 5 minutes.
            Service may be down, unhealthy, or load balancer is misconfigured.
          runbook: 'https://github.com/Karthi-cruise/cloudpilot/docs/no-traffic.md'

      # Error budget exhaustion warning (< 10% remaining)
      - alert: CloudPilotErrorBudgetLow
        expr: cloudpilot_error_budget_remaining_percent < 10
        for: 5m
        labels:
          severity: warning
          team: platform
          slo: availability
        annotations:
          summary: 'CloudPilot error budget critically low'
          description: >-
            Only {{ $value | humanizePercentage }} of monthly error budget remains.
            Review recent incidents and halt risky deployments.

  # ─────────────────────────────────────────────────────────────────────────────
  # Kubernetes Resource Rules
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cloudpilot.kubernetes
    rules:
      # Deployment replica count mismatch
      - alert: KubernetesDeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas{deployment="cloudpilot",namespace="cloudpilot"}
          != kube_deployment_status_replicas_available{deployment="cloudpilot",namespace="cloudpilot"}
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Deployment replicas mismatch'
          description: >-
            Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }}
            has {{ $value }} replicas available but spec requires more.
            Pods may be crash-looping or failing health checks.

      # HPA maxed out — can no longer scale
      - alert: KubernetesHPAMaxedOut
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas{namespace="cloudpilot"}
          == kube_horizontalpodautoscaler_spec_max_replicas{namespace="cloudpilot"}
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'HPA at maximum replicas'
          description: >-
            HPA {{ $labels.horizontalpodautoscaler }} in namespace {{ $labels.namespace }}
            has been at its maximum replica count for 10+ minutes.
            Consider increasing maxReplicas or optimizing resource usage.

      # Pod restart storm
      - alert: CloudPilotPodRestartingTooOften
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="cloudpilot"}[15m]) * 60 > 3
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Pod restarting too frequently'
          description: >-
            Pod {{ $labels.pod }} (container: {{ $labels.container }}) in namespace
            {{ $labels.namespace }} is restarting more than 3 times per minute.
            Likely a crash-loop. Check logs immediately.
          runbook: 'https://github.com/Karthi-cruise/cloudpilot/docs/pod-crashloop.md'

      # Pod not ready
      - alert: KubernetesPodNotReady
        expr: |
          kube_pod_status_ready{namespace="cloudpilot",condition="true"} == 0
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Pod not ready'
          description: >-
            Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been
            not ready for more than 3 minutes.

  # ─────────────────────────────────────────────────────────────────────────────
  # Resource Utilisation Rules
  # ─────────────────────────────────────────────────────────────────────────────
  - name: cloudpilot.resources
    rules:
      # High CPU — approaching limit
      - alert: CloudPilotHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{
            namespace="cloudpilot",
            container="cloudpilot"
          }[5m]) > 0.4
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High CPU usage on CloudPilot container'
          description: >-
            Container {{ $labels.container }} on pod {{ $labels.pod }} is using
            {{ $value | humanizePercentage }} CPU (threshold: 40% of limit).
            Consider horizontal scaling or CPU limit increase.

      # High memory — risk of OOM
      - alert: CloudPilotHighMemory
        expr: |
          container_memory_usage_bytes{
            namespace="cloudpilot",
            container="cloudpilot"
          }
          / container_spec_memory_limit_bytes{
            namespace="cloudpilot",
            container="cloudpilot"
          } > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High memory usage on CloudPilot container'
          description: >-
            Container {{ $labels.container }} on pod {{ $labels.pod }} is using
            {{ $value | humanizePercentage }} of its memory limit.
            OOM kill risk is elevated. Investigate memory leaks or increase limits.

      # Memory approaching OOM — critical threshold
      - alert: CloudPilotMemoryCritical
        expr: |
          container_memory_usage_bytes{
            namespace="cloudpilot",
            container="cloudpilot"
          }
          / container_spec_memory_limit_bytes{
            namespace="cloudpilot",
            container="cloudpilot"
          } > 0.95
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'CloudPilot container near OOM limit'
          description: >-
            Container {{ $labels.container }} on pod {{ $labels.pod }} is using
            {{ $value | humanizePercentage }} of its memory limit. OOM termination imminent.
